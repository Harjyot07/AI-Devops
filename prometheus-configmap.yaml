apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: app
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      
      - job_name: 'backend'
        static_configs:
          - targets: ['backend:3001']
      
      - job_name: 'frontend'
        static_configs:
          - targets: ['frontend:3000']
      
      - job_name: 'ollama'
        static_configs:
          - targets: ['ollama.ollama.svc.cluster.local:11434']
